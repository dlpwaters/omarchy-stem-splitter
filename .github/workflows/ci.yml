name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifest and Python helpers
        run: |
          python -m json.tool manifest.json >/dev/null
          python -m json.tool models.lock.json >/dev/null
          grep -q -- '--hash=sha256:' requirements.lock
          grep -q -- '--hash=sha256:' build-requirements.lock
          python -m py_compile stem_tool.py engine_runner.py
          PYTHONPATH=. python -m unittest discover -s tests -v
